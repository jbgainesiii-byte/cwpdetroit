# Cleaning With Purpose — public site
# Build an allowlisted public directory and adapt URLs/security hashes to the host.

[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[context.production.environment]
  SITE_URL = "https://cwpdetroit.com/"

# Security headers are generated in dist/_headers by the build script.
# Enable CWP_FORMS_ENABLED=true only on Netlify after configuring form detection
# and notifications. Verify delivery on a preview before exposing the live form.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Configure the chosen primary domain and its www redirect in Netlify when owned.
